<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Navigator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div id="app" class="max-w-7xl mx-auto px-4 py-6">
    <header class="mb-6 text-center">
      <h1 class="text-2xl font-bold text-blue-400 mb-1">收藏夹导航</h1>
      <p class="text-gray-500 text-sm">快速访问你的收藏内容</p>
    </header>
    
    <div class="controls mb-5 flex flex-wrap gap-3 items-center justify-between bg-gray-800 rounded-xl p-3">
      <div class="search-box flex-1 min-w-[200px]">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="搜索收藏..." 
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-gray-100 placeholder-gray-400 transition-colors"
        >
      </div>
      <div class="flex gap-2">
        <select id="sortSelect" class="px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-gray-100 cursor-pointer">
          <option value="default">默认</option>
          <option value="name">名称</option>
          <option value="date">时间</option>
        </select>
        <button id="reloadBtn" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors flex items-center gap-2 text-white cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>重载</span>
        </button>
      </div>
    </div>
    
    <div id="bookmarksContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    </div>
    
    <div id="loading" class="hidden text-center py-20 text-gray-400">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent mb-4"></div>
      <p>正在加载收藏夹...</p>
    </div>
    
    <div id="empty" class="hidden text-center py-20 text-gray-500">
      <svg class="w-16 h-16 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
      </svg>
      <p>未找到收藏夹内容</p>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
