<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Navigator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="app" class="container mx-auto px-4 py-8">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-center text-primary-400 mb-2">收藏夹导航</h1>
      <p class="text-center text-slate-400 text-sm">快速访问你的收藏内容</p>
    </header>
    
    <div class="controls mb-6 flex flex-wrap gap-4 items-center justify-between">
      <div class="search-box flex-1 min-w-[200px] max-w-md">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="搜索收藏夹..." 
          class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-primary-500 text-slate-100 placeholder-slate-500"
        >
      </div>
      <div class="flex gap-2">
        <select id="sortSelect" class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-primary-500 text-slate-100">
          <option value="default">默认排序</option>
          <option value="name">按名称排序</option>
          <option value="date">按添加时间</option>
        </select>
        <button id="reloadBtn" class="px-4 py-2 bg-primary-600 hover:bg-primary-700 rounded-lg transition-colors flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          重载
        </button>
      </div>
    </div>
    
    <div id="bookmarksContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    </div>
    
    <div id="loading" class="text-center py-20 text-slate-400">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary-500 border-t-transparent"></div>
      <p class="mt-4">正在加载收藏夹...</p>
    </div>
    
    <div id="empty" class="hidden text-center py-20 text-slate-400">
      <svg class="w-16 h-16 mx-auto mb-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
      </svg>
      <p>未找到收藏夹内容</p>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
